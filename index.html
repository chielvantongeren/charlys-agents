<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Charly's Agents"/>
<meta name="theme-color" content="#0b0b0c"/>
<title>Charly's Agents</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#0b0b0c;--card:#141416;--card2:#1c1c1f;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --g:#D4B27A;--g2:#F0D59C;--gs:rgba(212,178,122,.12);--gl:rgba(212,178,122,.35);
  --tx:#F3EEE4;--mu:rgba(243,238,228,.58);--m2:rgba(243,238,228,.32);
  --ok:#5BD69A;--oks:rgba(91,214,154,.1);--er:#F06B6B;--ers:rgba(240,107,107,.1);--am:#F5B84D;--ams:rgba(245,184,77,.1);
  --r:18px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;top:-25%;right:-30%;width:90%;height:70%;background:radial-gradient(closest-side,rgba(212,178,122,.10),transparent);pointer-events:none;z-index:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--g2)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,178,122,.5)}50%{box-shadow:0 0 0 7px rgba(212,178,122,0)}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.top{position:sticky;top:0;z-index:50;padding:calc(var(--sat) + 10px) 16px 10px;background:rgba(11,11,12,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top-i{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:36px}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:-.2px}
.logo em{color:var(--g);font-style:italic;font-weight:600}
.ttl{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);flex-shrink:0}
.ib svg{width:18px;height:18px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:18px 16px calc(110px + var(--sab))}
.view{animation:up .35s ease both}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--g);margin-bottom:8px}
h1{font-family:'Playfair Display',serif;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.4px;margin-bottom:8px}
h1 em{color:var(--g);font-style:italic;font-weight:600}
h2{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);margin:28px 0 12px;display:flex;align-items:center;justify-content:space-between}
h2 .cnt{font-size:11px;color:var(--m2);letter-spacing:1px}
.lead{font-size:14px;color:var(--mu);line-height:1.55;font-weight:300}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:10px}
.tap{cursor:pointer;transition:transform .12s,border-color .2s}
.tap:active{transform:scale(.985)}
.tap:hover{border-color:var(--line2)}
.gold{border-color:var(--gl);background:linear-gradient(180deg,rgba(212,178,122,.08),rgba(212,178,122,.02) 60%),var(--card)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.t1{font-size:15px;font-weight:500;line-height:1.35}
.t2{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.45}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;font-size:14px;font-weight:600;background:linear-gradient(135deg,var(--g),var(--g2));color:#16120b;box-shadow:0 6px 20px rgba(212,178,122,.22);transition:transform .12s,opacity .2s}
.b:active{transform:scale(.97)}
.b:disabled{opacity:.35;pointer-events:none}
.b.full{width:100%}
.b2{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;border-radius:13px;font-size:13px;font-weight:500;background:var(--card2);border:1px solid var(--line2);color:var(--tx);transition:transform .12s}
.b2:active{transform:scale(.97)}
.b2:disabled{opacity:.35;pointer-events:none}
.b2.sm{height:34px;padding:0 12px;font-size:12px;border-radius:10px}
.b2.ok{color:var(--ok);border-color:rgba(91,214,154,.35);background:var(--oks)}
.b2.er{color:var(--er);border-color:rgba(240,107,107,.35);background:var(--ers)}
.b2.gd{color:var(--g2);border-color:var(--gl);background:var(--gs)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.two>*{flex:1}
.lnk{font-size:12px;color:var(--mu);text-decoration:underline;text-underline-offset:3px;padding:8px 0}
textarea,input[type=text],input[type=password]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;font-family:inherit;font-weight:300;color:var(--tx);outline:none;line-height:1.5;transition:border-color .2s}
textarea{resize:vertical;min-height:88px}
textarea:focus,input:focus{border-color:var(--gl)}
::placeholder{color:var(--m2)}
label.l{display:block;font-size:12px;color:var(--mu);margin:16px 0 7px;font-weight:500}
label.l span{color:var(--m2);font-weight:300}
.cap{padding:6px;border-radius:22px;background:var(--card);border:1px solid var(--gl);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.cap textarea{background:transparent;border:none;min-height:110px;font-size:17px;padding:14px}
.cap .btns{padding:6px;flex-wrap:nowrap}
.cap .b2{white-space:nowrap;padding:0 10px}
.mic{width:44px;height:44px;border-radius:13px;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:0 0 44px!important}
.mic svg{width:18px;height:18px;stroke:var(--tx);fill:none;stroke-width:2}
.mic.on{background:var(--ers);border-color:var(--er)}
.mic.on svg{stroke:var(--er)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:4px 9px;border-radius:100px;background:var(--card2);border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--oks);border-color:rgba(91,214,154,.25)}
.pill.er{color:var(--er);background:var(--ers);border-color:rgba(240,107,107,.25)}
.pill.am{color:var(--am);background:var(--ams);border-color:rgba(245,184,77,.25)}
.pill.gd{color:var(--g2);background:var(--gs);border-color:var(--gl)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:left;cursor:pointer}
.stat b{display:block;font-size:24px;font-weight:600;font-family:'Playfair Display',serif}
.stat span{font-size:11px;color:var(--mu)}
.stat.hi b{color:var(--g)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;height:36px;border-radius:10px;font-size:12px;font-weight:500;color:var(--mu)}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:0 1px 0 var(--line2) inset}
.seg button i{font-style:normal;color:var(--m2);margin-left:4px}
.att{display:flex;gap:12px;align-items:center}
.att .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.steps{display:flex;align-items:flex-start;margin:6px 0 22px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:10px;color:var(--m2);font-weight:500;letter-spacing:.3px}
.st::before{content:'';position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line2);z-index:0}
.st:first-child::before{display:none}
.st i{width:24px;height:24px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;z-index:1;color:var(--m2)}
.st.done{color:var(--mu)}
.st.done i{background:var(--g);border-color:var(--g);color:#16120b}
.st.done::before,.st.cur::before{background:var(--g)}
.st.cur{color:var(--g2)}
.st.cur i{border-color:var(--g);color:var(--g);animation:pulse 2s infinite}
.st.kill i{background:var(--er);border-color:var(--er);color:#fff}
.av{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;position:relative}
.av.sm{width:32px;height:32px;border-radius:10px;font-size:15px}
.av .s{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);background:var(--m2)}
.av .s.done{background:var(--ok)}.av .s.err{background:var(--er)}.av .s.run{background:var(--g);animation:pulse 1.4s infinite}
.pick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin:0 -2px}
.pick::-webkit-scrollbar{display:none}
.pk{flex:0 0 auto;width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:10.5px;text-align:center;line-height:1.2;color:var(--m2);transition:all .2s}
.pk .av{opacity:.35;filter:grayscale(1);transition:all .2s}
.pk.on{border-color:var(--gl);color:var(--tx);background:var(--gs)}
.pk.on .av{opacity:1;filter:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid .card+.card{margin-top:0}
.ag{padding:12px;display:flex;gap:10px;align-items:center}
.ag .n{font-size:13px;font-weight:600;line-height:1.2}
.ag .r{font-size:11px;color:var(--mu);margin-top:2px}
.tl{display:flex;margin:16px 0 18px}
.tn{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;font-size:10px;color:var(--m2);text-align:center}
.tn::before{content:'';position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line2)}
.tn:first-child::before{display:none}
.tn i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);z-index:1}
.tn.done{color:var(--mu)}.tn.done i{background:var(--g);border-color:var(--g)}.tn.done::before,.tn.run::before{background:var(--g)}
.tn.run{color:var(--g2)}.tn.run i{border-color:var(--g);animation:pulse 1.4s infinite;background:rgba(212,178,122,.3)}
.tn.err i{background:var(--er);border-color:var(--er)}
.tn.skip{opacity:.35}.tn.skip i{border-style:dashed}
.dec{border-radius:22px;padding:0;overflow:hidden}
.dech{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.skel{height:12px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,var(--card2) 0,rgba(255,255,255,.06) 50%,var(--card2) 100%);background-size:400px 100%;animation:shimmer 1.4s infinite linear}
.md{font-size:14.5px;line-height:1.7;color:rgba(243,238,228,.86);font-weight:300;overflow-wrap:anywhere;padding:16px}
.md h1,.md h2,.md h3,.md h4{font-family:'Playfair Display',serif;color:var(--g);margin:20px 0 6px;line-height:1.3;letter-spacing:0;text-transform:none;display:block}
.md h2{font-size:18px}.md h3{font-size:16px}.md h4{font-size:15px}
.md>*:first-child{margin-top:0}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 12px 20px}.md li{margin-bottom:5px}
.md strong{color:var(--tx);font-weight:600}
.md code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px;font-size:12.5px}
.md table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:12.5px;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--line2);padding:7px 9px;text-align:left;vertical-align:top}
.md th{color:var(--g);font-weight:500}
.md hr{border:none;border-top:1px solid var(--line2);margin:16px 0}
.md .rep{margin-top:16px;padding:14px;border-radius:14px;background:var(--card2);border-left:3px solid var(--g)}
.ban{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.ban.am{background:var(--ams);color:var(--am);border:1px solid rgba(245,184,77,.25)}
.ban.ok{background:var(--oks);color:var(--ok);border:1px solid rgba(91,214,154,.25)}
.ban.er{background:var(--ers);color:var(--er);border:1px solid rgba(240,107,107,.25)}
.ban.mu{background:var(--card2);color:var(--mu);border:1px solid var(--line)}
details.card{padding:0}
details.card>summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin-left:auto;transition:transform .2s;flex-shrink:0}
details.card[open]>summary::after{transform:rotate(-135deg)}
details.card[open]>summary{border-bottom:1px solid var(--line)}
.dos{font-size:13.5px;color:var(--mu);white-space:pre-wrap;line-height:1.6;padding:14px 16px}
.load{display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px 16px;color:var(--mu);font-size:13px}
.sp{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--g);animation:sp .8s linear infinite}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px 12px calc(8px + var(--sab));background:rgba(14,14,15,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.tabbar-i{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--m2);padding:4px 0;font-weight:500}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--g2)}
.fab{justify-self:center;width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(212,178,122,.35);margin-top:-22px}
.fab svg{width:24px;height:24px;stroke:#16120b;stroke-width:2.5;fill:none;stroke-linecap:round}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;animation:fade .2s}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;max-height:90vh;display:none;flex-direction:column;background:#121214;border-top:1px solid var(--line2);border-radius:24px 24px 0 0;animation:sheet .28s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet.on{display:flex}
.sh-h{padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 12px}
.sh-b{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sh-f{padding:12px 16px calc(12px + var(--sab));border-top:1px solid var(--line)}
.sh-f:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:#202023;border:1px solid var(--gl);color:var(--tx);padding:10px 16px;border-radius:100px;font-size:13px;z-index:200;display:none;white-space:nowrap}
.empty{font-size:13px;color:var(--m2);padding:14px 2px;line-height:1.5}
.sw{position:relative;width:48px;height:28px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line2);border-radius:28px;cursor:pointer;transition:.2s}
.sw span::before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;background:var(--tx);border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--g)}
.sw input:checked+span::before{transform:translateX(20px)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
</style>
</head>
<body>

<div class="top"><div class="top-i" id="top"></div></div>
<main id="app"></main>

<nav class="tabbar"><div class="tabbar-i">
  <button class="tb" data-t="home" onclick="go('#/')"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="tb" data-t="pipe" onclick="go('#/pijplijn')"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></svg>Pijplijn</button>
  <button class="fab" onclick="quickIdea()" aria-label="Nieuw idee"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tb" data-t="runs" onclick="go('#/analyses')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analyses</button>
  <button class="tb" data-t="set" onclick="go('#/instellingen')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Instellingen</button>
</div></nav>

<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="sh-h"><div class="grab"></div><div id="sh-h"></div></div><div class="sh-b" id="sh-b"></div><div class="sh-f" id="sh-f"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this)"/>

<script>
/* ================= AGENTS ================= */
var AGENTS = [
  {id:"re",nm:"De Researcher",em:"\u{1F50D}",cl:"#9B59B6",rl:"Regels & feiten",web:true,task:"Zoek de relevante wet- en regelgeving, vergunningen, subsidies en vergelijkbare projecten of precedenten. Alleen feiten die je kunt onderbouwen; noem bij elke claim de bron."},
  {id:"st",nm:"De Strateeg",em:"\u{1F9E0}",cl:"#3E9B72",rl:"Route & keuzes",web:false,task:"Bepaal de beste route naar het doel. Geef fases, de kritische beslismomenten en wat Chiel juist NIET moet doen. Benoem de belangrijkste strategische keuze die nu openstaat."},
  {id:"pm",nm:"De Projectmanager",em:"\u{1F4CB}",cl:"#4A90D9",rl:"Planning & acties",web:false,task:"Maak een werkstructuur: taken, mijlpalen, wie wat doet (Chiel zelf of welk type partner), afhankelijkheden en risico's. Eindig met een concrete actielijst voor de komende 14 dagen."},
  {id:"co",nm:"De Communicator",em:"\u270F\uFE0F",cl:"#C9A96E",rl:"Verhaal & pitch",web:false,task:"Schrijf de kernboodschap (1 zin), een pitch van max. een halve A4 en per doelgroep de belangrijkste boodschap en het beste kanaal. Toon: authentiek en ingetogen, geen marketingpraat of superlatieven."},
  {id:"ma",nm:"De Marktanalist",em:"\u{1F3AF}",cl:"#E05C8A",rl:"Doelgroep & markt",web:true,task:"Analyseer de doelgroepen (wie, waarom, wat ze kunnen en willen betalen), concurrenten en alternatieven, en de positionering. Gebruik echte marktdata waar mogelijk en zeg het als je die niet hebt."},

function importData(inp){
  var f=inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result); if(!d.projects||!d.runs) throw 0;
      if(!confirm("Back-up samenvoegen? ("+d.projects.length+" projecten, "+d.runs.length+" analyses, "+((d.ideas||[]).length)+" ideeën)")) return;
      d.projects.forEach(function(p){ if(!getP(p.id)) DB.projects.push(p); });
      d.runs.forEach(function(r){ if(!getR(r.id)) DB.runs.push(r); });
      (d.ideas||[]).forEach(function(x){ if(!getI(x.id)) DB.ideas.push(x); });

      save(); toast("Teruggezet"); route();

/* ================= STAGES ================= */
function stageOf(x){
  if(x.killed) return "gestopt";
  if(x.projectId && getP(x.projectId)) return "project";
  if(x.test && x.test.started) return "test";
  return "idee";
}
function ideaTitle(x){ var t=(x.an&&x.an.s==="done"&&sec(x.an.t,"naam"))||(x.dump||"").split("\n")[0]; t=plainInline(t||"Leeg idee").replace(/[#*]/g,"").trim(); return t.length>70?t.slice(0,70)+"...":t; }
function ideaPill(x){
  var s=stageOf(x);
  if(s==="gestopt") return '<span class="pill er">gestopt</span>';
  if(s==="project") return '<span class="pill ok">project</span>';
  if(s==="test"){ var r=x.test.result; return r==="ok"?'<span class="pill ok">test geslaagd</span>':r==="fail"?'<span class="pill er">test gesneuveld</span>':'<span class="pill am"><span class="dot"></span>test loopt · '+ageDays(x.test.started)+'d</span>'; }
  if(ACTIVE_I[x.id]) return '<span class="pill am"><span class="dot"></span>bezig</span>';
  if(x.an&&x.an.s==="done") return '<span class="pill gd">ontleed</span>';
  if(x.ex&&x.ex.s==="done") return '<span class="pill">verkend</span>';
  return '<span class="pill">ruw</span>';
}
function ideaCardHtml(x){ return '<div class="card tap row" onclick="go(\'#/idee/'+x.id+'\')"><div class="grow"><div class="t1 ell">'+esc(ideaTitle(x))+'</div><div class="t2">'+ago(x.updated)+'</div></div>'+ideaPill(x)+'</div>'; }
function projCardHtml(p){
  var n=DB.runs.filter(function(r){return r.projectId===p.id;}).length, old=ageDays(p.updated)>30;
  return '<div class="card tap" onclick="go(\'#/project/'+p.id+'\')"><div class="row between"><div class="t1 grow ell" style="font-family:\'Playfair Display\',serif;font-size:17px;font-weight:700">'+esc(p.name)+'</div>'+(old?'<span class="pill am">dossier '+ageDays(p.updated)+'d oud</span>':'<span class="pill">'+n+' analyses</span>')+'</div><div class="t2">'+esc(p.desc)+'</div></div>';
}
function runSummary(r){
  var ids=r.agents.concat(["rg"]), d=0,e=0,l=0;
  ids.forEach(function(id){ var x=r.res[id]; if(!x) return; if(x.s==="done") d++; else if(x.s==="err") e++; else l++; });
  return {d:d,e:e,l:l,t:ids.length};
}
function runPill(r){ var s=runSummary(r); if(ACTIVE[r.id]) return '<span class="pill am"><span class="dot"></span>bezig</span>'; if(s.l) return '<span class="pill am">onderbroken</span>'; if(s.e) return '<span class="pill er">'+s.e+' fout</span>'; return '<span class="pill ok">klaar</span>'; }
function runCardHtml(r, showProj){
  var p=getP(r.projectId);
  return '<div class="card tap row" onclick="go(\'#/analyse/'+r.id+'\')"><div class="grow"><div class="t1 ell">'+esc(r.q||"Algemene analyse")+'</div><div class="t2">'+(showProj&&p?esc(p.name)+' · ':'')+fmtDT(r.created)+' · '+r.agents.length+' agents</div></div>'+runPill(r)+'</div>';

  var st=stageOf(x), busy=!!ACTIVE_I[id];

  var names=["Dump","Verken","Ontleed","Test","Project"];

function sec(t,name){
  var out={},cur=null;
  String(t||"").split("\n").forEach(function(l){ var m=l.match(/^#{1,4}\s+(.*)$/); if(m){ cur=m[1].replace(/[*_`]/g,"").trim().toLowerCase(); out[cur]=""; } else if(cur!==null) out[cur]+=l+"\n"; });
  for(var k in out) if(k.indexOf(name)===0) return out[k].trim();
  return "";
}

function sleep(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
async function callClaude(system, user, useWeb){
  var key=gKey(); if(!key) throw new Error("Geen API key ingesteld (Instellingen).");
  var base=Array.isArray(user)?user:[{role:"user",content:user}];
  var messages=base, texts=[], cites={}, note="";
  for(var turn=0;turn<4;turn++){
    var body={model:gModel(),max_tokens:4000,system:system,messages:messages};
    if(useWeb) body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:4}];
    var resp=null;
    for(var attempt=0;attempt<3;attempt++){
      resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
      if(resp.status===429||resp.status===529||resp.status>=500){ await sleep(4000*(attempt+1)); continue; }
      break;
    }
    if(!resp.ok){
      var j={}; try{ j=await resp.json(); }catch(x){}
      var msg=(j.error&&j.error.message)||("HTTP "+resp.status);
      if(useWeb&&/web_search|tool/i.test(msg)){ useWeb=false; note="\n\n_(Web search niet beschikbaar voor deze key: analyse zonder bronnen.)_"; turn--; continue; }
      if(resp.status===404||/model/i.test(msg)) msg+=" (Controleer het model in Instellingen.)";
      if(resp.status===401) msg+=" (API key ongeldig.)";
      if(/credit|balance/i.test(msg)) msg+=" (Tegoed op? Kijk in console.anthropic.com.)";
      throw new Error(msg);
    }
    var d=await resp.json();
    (d.content||[]).forEach(function(b){ if(b.type==="text"){ texts.push(b.text); (b.citations||[]).forEach(function(c){ if(c.url) cites[c.url]=c.title||c.url; }); } });
    if(d.stop_reason==="pause_turn"){ messages=base.concat([{role:"assistant",content:d.content}]); continue; }
    if(d.stop_reason==="max_tokens") note+="\n\n_(Antwoord afgekapt op maximale lengte.)_";
    break;
  }
  var out=texts.join("").trim()||"Geen inhoud ontvangen.";
  var urls=Object.keys(cites);
  if(urls.length) out+="\n\n## Bronnen\n"+urls.map(function(u){return "- ["+cites[u].replace(/[\[\]]/g,"")+"]("+u+")";}).join("\n");
  return out+note;
}

function pool(items,n,fn){ var i=0; function w(){ return i<items.length?Promise.resolve(fn(items[i++])).then(w):Promise.resolve(); } var ws=[]; for(var k=0;k<Math.min(n,items.length);k++) ws.push(w()); return Promise.all(ws); }
function qText(r){ return r.q?"Vraag van Chiel: "+r.q:"Geef je analyse van dit project in de huidige fase."; }
function factsMsg(r){ var x=r.res.re; return (x&&x.s==="done")?"\n\n=== FEITENRONDE (De Researcher heeft dit al uitgezocht; bouw hierop voort, spreek het alleen tegen met onderbouwing) ===\n"+x.t:""; }
function specIds(r){ return r.agents.filter(function(id){ return id!=="re"&&id!=="dv"; }); }

async function execRun(rid){
  if(ACTIVE[rid]) return;

  function ph(t){ ACTIVE[rid]=t; refresh(rid); }
  async function one(id,fn){
    r.res[id]={s:"run"}; save(); refresh(rid);

    save(); refresh(rid);
  }
  try{
    if(!p) throw new Error("Project niet gevonden");
    ACTIVE[rid]="Starten";
    r.agents.concat(["rg"]).forEach(function(id){ if(r.res[id].s!=="done") r.res[id]={s:"wait"}; });
    if(r.agents.indexOf("re")>=0&&r.res.re.s!=="done"){ ph("Feitenronde"); await one("re",function(){ return callClaude(sysAgent(agentById("re"),p),qText(r),gWeb()); }); }
    var todo=specIds(r).filter(function(id){ return r.res[id].s!=="done"; });
    if(todo.length){ ph("Specialisten"); await pool(todo,3,function(id){ var a=agentById(id); return one(id,function(){ return callClaude(sysAgent(a,p),qText(r)+factsMsg(r),a.web&&gWeb()); }); }); }
    var doneIds=r.agents.filter(function(id){ return id!=="dv"&&r.res[id].s==="done"; });

      var bundle=qText(r)+"\n\nHieronder de analyses van je teamgenoten. Val de zwakste punten aan: te optimistische aannames, cijfers die niet kloppen of niet onderbouwd zijn, tegenstrijdigheden tussen specialisten, blinde vlekken. Noem steeds wie je aanvalt en waarom. Wees specifiek, citeer waar nodig.\n\n"+doneIds.map(function(id){ return "=== "+agentById(id).nm+" ("+id+") ===\n"+r.res[id].t; }).join("\n\n")+"\n\nSluit af met exact één regel in dit formaat (max 3 codes, alleen de specialisten die het meest moeten reageren):\nAANGEVALLEN: code1, code2\nCodes: "+list;
      await one("dv",function(){ return callClaude(sysAgent(agentById("dv"),p),bundle,false); });
      r.attacked=[];
      if(r.res.dv.s==="done"){
        var m=r.res.dv.t.match(/AANGEVALLEN:\s*([^\n]*)/i);
        if(m) r.attacked=m[1].split(/[,\s]+/).map(function(x){return x.trim().toLowerCase();}).filter(function(x){ return doneIds.indexOf(x)>=0; }).slice(0,3);
        r.res.dv.t=r.res.dv.t.replace(/\n?.*AANGEVALLEN:[^\n]*/i,"").trim();
        if(r.attacked.length) r.res.dv.t+="\n\n**Moeten reageren:** "+r.attacked.map(function(id){return agentById(id).nm;}).join(", ");
      }
      save();
    }
    var reps=(r.attacked||[]).filter(function(id){ return r.res[id].s==="done"&&!(r.res[id].rep&&r.res[id].rep.s==="done"); });
    if(reps.length&&r.res.dv.s==="done"){
      ph("Reacties");
      await pool(reps,3,async function(id){
        var a=agentById(id); r.res[id].rep={s:"run"}; save(); refresh(rid);
        try{
          var msgs=[{role:"user",content:qText(r)+factsMsg(r)},{role:"assistant",content:r.res[id].t},{role:"user",content:"De Advocaat van de Duivel heeft het team bekritiseerd:\n\n"+r.res.dv.t+"\n\nReageer alleen op de kritiek die jou raakt. Geef ruiterlijk toe waar hij gelijk heeft en herzie dan concreet je advies; weerleg met argumenten waar hij ongelijk heeft. Geen herhaling van je eerdere analyse. Max. 250 woorden, geen hoofdkop."}];
          r.res[id].rep={s:"done",t:await callClaude(sysAgent(a,p),msgs,false)};
        }catch(e){ r.res[id].rep={s:"err",e:e.message||String(e)}; }
        save(); refresh(rid);
      });
    }
    doneIds=r.agents.filter(function(id){ return r.res[id].s==="done"; });
    if(r.res.rg.s!=="done"){
      if(doneIds.length<2) r.res.rg={s:"err",e:"Te weinig geslaagde analyses om samen te vatten."};
      else{
        ph("Synthese");

          var x=r.res[id], t="=== "+agentById(id).nm+(id==="dv"?" (KRITIEKRONDE)":"")+" ===\n"+x.t;

        }).join("\n\n");

var PHMAP={"Feitenronde":"Feiten","Specialisten":"Specialisten","Kritiekronde":"Kritiek","Reacties":"Reacties","Synthese":"Besluit"};
function phases(r){
  function agg(ids){ if(!ids.length) return "skip"; var s=ids.map(function(id){return (r.res[id]||{}).s;}); if(s.every(function(x){return x==="done";})) return "done"; if(s.some(function(x){return x==="run";})) return "run"; if(s.some(function(x){return x==="err";})&&!s.some(function(x){return x==="wait";})) return "err"; return "wait"; }
  var hasDv=r.agents.indexOf("dv")>=0, repS="skip";
  if(hasDv){ var dvs=(r.res.dv||{}).s; if(dvs!=="done") repS=dvs==="err"?"skip":"wait"; else if(!(r.attacked||[]).length) repS="skip"; else { var rs=r.attacked.map(function(id){ return (r.res[id].rep||{}).s||"wait"; }); repS=rs.every(function(x){return x==="done";})?"done":rs.some(function(x){return x==="run";})?"run":rs.some(function(x){return x==="err";})?"err":"wait"; } }
  var ph=[["Feiten",r.agents.indexOf("re")>=0?r.res.re.s:"skip"],["Specialisten",agg(specIds(r))],["Kritiek",hasDv?r.res.dv.s:"skip"],["Reacties",repS],["Besluit",r.res.rg.s]];
  if(ACTIVE[r.id]) ph.forEach(function(q){ if(q[1]==="wait"&&PHMAP[ACTIVE[r.id]]===q[0]) q[1]="run"; });
  return ph;
}

/* ================= MARKDOWN ================= */
function inl(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>").replace(/(^|\s)_([^_]+)_(?=\s|$|[.,;:])/g,"$1<em>$2</em>");
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  var L=String(src||"").replace(/\r/g,"").split("\n"),out=[],i=0,para=[];
  function flush(){ if(para.length){ out.push("<p>"+para.map(inl).join("<br>")+"</p>"); para=[]; } }
  while(i<L.length){
    var t=L[i].trim(),m;
    if(!t){ flush(); i++; continue; }
    if(m=t.match(/^(#{1,4})\s+(.*)$/)){ flush(); var lv=Math.min(4,m[1].length+1); out.push("<h"+lv+">"+inl(m[2])+"</h"+lv+">"); i++; continue; }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ flush(); out.push("<hr>"); i++; continue; }
    if(t.charAt(0)==="|"){
      flush(); var rows=[]; while(i<L.length&&L[i].trim().charAt(0)==="|"){ rows.push(L[i].trim()); i++; }
      var h="<table>",first=true;
      rows.forEach(function(rw){ if(/^\|?[\s:\-|]+\|?$/.test(rw)) return; var cells=rw.replace(/^\||\|$/g,"").split("|"); h+="<tr>"+cells.map(function(cv){ return (first?"<th>":"<td>")+inl(cv.trim())+(first?"</th>":"</td>"); }).join("")+"</tr>"; first=false; });
      out.push(h+"</table>"); continue;
    }
    if(/^([-*\u2022]|\d+[.)])\s+/.test(t)){
      flush(); var ord=/^\d/.test(t),items=[];
      while(i<L.length&&/^\s*([-*\u2022]|\d+[.)])\s+/.test(L[i])){ var ind=L[i].match(/^\s*/)[0].length>=2; items.push((ind?"&nbsp;&nbsp;&nbsp;&nbsp;":"")+inl(L[i].trim().replace(/^([-*\u2022]|\d+[.)])\s+/,""))); i++; }
      out.push((ord?"<ol>":"<ul>")+items.map(function(x){return "<li>"+x+"</li>";}).join("")+(ord?"</ol>":"</ul>")); continue;
    }
    para.push(t); i++;
  }
  flush(); return out.join("");
}

/* ================= PDF ================= */
function hxRgb(h){ return {r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)}; }
function tint(c,f){ return {r:Math.round(c.r+(255-c.r)*f),g:Math.round(c.g+(255-c.g)*f),b:Math.round(c.b+(255-c.b)*f)}; }
function pdfSafe(s){
  return String(s).replace(/\u20AC\s?/g,"EUR ").replace(/[\u2192\u279C\u27A1]/g,"->").replace(/\u2190/g,"<-").replace(/\u2248/g,"~").replace(/\u2265/g,">=").replace(/\u2264/g,"<=")
    .replace(/[\u2022\u25CF\u25AA]/g,"-").replace(/[\u2013\u2014]/g,"-").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\u2026/g,"...").replace(/\u00D7/g,"x")
    .replace(/[\u2713\u2714\u2705]/g,"v").replace(/[\u274C\u2717]/g,"x").replace(/[^\x00-\xFF]/g,"");
}
function plainInline(s){ return String(s||"").replace(/\*\*([^*]+)\*\*/g,"$1").replace(/__([^_]+)__/g,"$1").replace(/`([^`]+)`/g,"$1").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1$2").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,"$1 ($2)"); }
function mkPDF(ids,r,title){
  if(!window.jspdf){ toast("PDF-bibliotheek laadt nog, probeer zo opnieuw"); return; }
  var p=getP(r.projectId)||{name:""};
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  var W=210,H=297,m=18,lw=W-m*2,y=0,pageNo=1;
  doc.setFillColor(11,11,12); doc.rect(0,0,W,H,"F");
  doc.setTextColor(212,178,122); doc.setFont("helvetica","bold"); doc.setFontSize(26); doc.text("Charly's Agents",m,55);
  doc.setFont("helvetica","normal"); doc.setFontSize(14); doc.setTextColor(243,238,228); doc.text(doc.splitTextToSize(pdfSafe(p.name),lw),m,68);
  doc.setFontSize(11); doc.setTextColor(180,170,150); doc.text(doc.splitTextToSize(pdfSafe(title),lw),m,80);
  if(r.q){ doc.setFontSize(10); doc.text(doc.splitTextToSize(pdfSafe('"'+r.q+'"'),lw),m,92); }
  doc.setFontSize(9); doc.setTextColor(120,110,90); doc.text(pdfSafe(fmtDT(r.created)),m,280);
  function foot(a){ doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(170,160,140); doc.text(pdfSafe(a.nm+" - "+p.name),m,289); doc.text(String(++pageNo),W-m,289,{align:"right"}); }
  ids.forEach(function(id){
    var a=agentById(id),x=r.res[id]; if(!x||x.s!=="done") return;
    var col=hxRgb(a.cl),tn=tint(col,.88);
    doc.addPage(); doc.setFillColor(tn.r,tn.g,tn.b); doc.rect(0,0,W,30,"F"); doc.setFillColor(col.r,col.g,col.b); doc.rect(0,0,4,30,"F");
    doc.setTextColor(Math.round(col.r*.7),Math.round(col.g*.7),Math.round(col.b*.7)); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text(pdfSafe(id==="rg"?"Het besluit - De Regisseur":a.nm),m,14);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(110,100,85); doc.text(pdfSafe(a.rl.toUpperCase()),m,22);
    foot(a); y=40;
    function need(h){ if(y+h>278){ doc.addPage(); foot(a); y=m; } }
    var full=x.t+((x.rep&&x.rep.s==="done")?"\n\n## Reactie op de kritiek\n"+x.rep.t:"");
    pdfSafe(full).replace(/\r/g,"").split("\n").forEach(function(raw){
      var t=raw.trim(),mm;
      if(!t){ y+=2.5; return; }
      if(/^(-{3,}|\*{3,})$/.test(t)) return;
      if(/^\|?[\s:\-|]+\|?$/.test(t)&&t.indexOf("-")>=0) return;
      if(mm=t.match(/^#{1,4}\s+(.*)$/)){ need(12); y+=3; doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(Math.round(col.r*.75),Math.round(col.g*.75),Math.round(col.b*.75)); doc.splitTextToSize(plainInline(mm[1]),lw).forEach(function(s){ need(6); doc.text(s,m,y); y+=6; }); y+=1; return; }
      var indent=0,bullet="";
      if(t.charAt(0)==="|"){ t=t.replace(/^\||\|$/g,"").split("|").map(function(s){return s.trim();}).join("  |  "); }
      else if(mm=t.match(/^([-*]|\d+[.)])\s+(.*)$/)){ bullet=/^\d/.test(mm[1])?mm[1]:"-"; t=mm[2]; indent=6; if(/^\s{2,}/.test(raw)) indent=11; }
      var isB=/^\*\*[^*]+\*\*:?$/.test(t);
      doc.setFont("helvetica",isB?"bold":"normal"); doc.setFontSize(10); doc.setTextColor(40,36,28);
      doc.splitTextToSize(plainInline(t),lw-indent).forEach(function(s,k){ need(5.5); if(k===0&&bullet) doc.text(bullet,m+indent-5,y); doc.text(s,m+indent,y); y+=5.2; });
      y+=0.8;
    });
  });
  doc.save((p.name+"-"+title).replace(/[^a-z0-9]+/gi,"_").toLowerCase().slice(0,80)+".pdf");
}
function onePDF(rid,id){ mkPDF([id],getR(rid),agentById(id).nm); }
function allPDF(rid){ var r=getR(rid),ids=tabOrder(r).filter(function(id){return r.res[id]&&r.res[id].s==="done";}); if(!ids.length){ toast("Nog niets klaar om te exporteren"); return; } mkPDF(ids,r,"Totaalrapport"); }

/* ================= INIT ================= */
function markInterrupted(){
  var ch=false;
  DB.runs.forEach(function(r){ Object.keys(r.res).forEach(function(k){ var x=r.res[k]; if(x.s==="run"){ r.res[k]={s:"wait"}; ch=true; } if(x.rep&&x.rep.s==="run"){ delete x.rep; ch=true; } }); });
  DB.ideas.forEach(function(i){ ["ex","an"].forEach(function(k){ if(i[k]&&i[k].s==="run"){ i[k]={s:"err",e:"Onderbroken (app gesloten). Probeer opnieuw."}; ch=true; } }); });
  if(ch) save();
}
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSheet(); });
loadDB(); markInterrupted();
if(!gKey() && (!location.hash||location.hash==="#/"||location.hash==="#")) location.hash="#/instellingen"; else route();
